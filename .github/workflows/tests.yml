name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [mechanics, story, controller, pwa, camps, ch4, ch5, gunplay, side, gfx, riders, brawl, town, mobile, polish, lint, animals]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Playwright and Chromium
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Build
        run: |
          python build.py
          git diff --exit-code game.html || (echo "::error::game.html is out of date. Run python3 build.py and commit it." && exit 1)

      - name: Run ${{ matrix.suite }} tests
        working-directory: tests
        run: python test_${{ matrix.suite }}.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.suite }}
          path: tests/*.png
          if-no-files-found: ignore
          retention-days: 7

  # publish the installable web app (site/) to GitHub Pages once every suite passes on main
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build site
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
